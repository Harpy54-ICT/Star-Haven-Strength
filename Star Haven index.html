<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Star Haven Strength — Coming Soon</title>
<meta name="description" content="Star Haven Strength is launching soon. Online personal training for military, veterans, and civilians." />
<style>
  :root {
    --deep-green: #163a2f;
    --gold: #b8873c;
    --cream: #faf8f4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--cream);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .logo {
    width: 220px;
    max-width: 60vw;
    height: auto;
    margin-bottom: 32px;
  }
  h1 {
    color: var(--deep-green);
    font-size: 2.2rem;
    letter-spacing: 2px;
    margin: 0 0 12px 0;
  }
  p.tagline {
    color: var(--gold);
    font-size: 1.1rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin: 0 0 40px 0;
  }
  .coming-soon {
    display: inline-block;
    border: 2px solid var(--deep-green);
    color: var(--deep-green);
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 12px 32px;
    border-radius: 4px;
    font-size: 1rem;
  }
  footer {
    margin-top: 48px;
    color: #999;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="logo.png" alt="Star Haven Strength" class="logo" />
    <h1>Star Haven Strength</h1>
    <p class="tagline">Online Personal Training</p>
    <div class="coming-soon">Coming Soon</div>
    <footer>&copy; 2026 Star Haven Strength</footer>
  </div>
</body>
</html>
